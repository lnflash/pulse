[workspace]
resolver = "2"
members = [
    "crates/pulse-domain",
    "crates/pulse-application",
    "crates/pulse-infrastructure",
    "crates/pulse-api",
    "crates/pulse-server",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
authors = ["Flash Engineering Team"]
license = "UNLICENSED"
repository = "https://github.com/lnflash/pulse"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"

# Web framework
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
hyper = "1.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database and caching
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = "0.18"

# HTTP client
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# GraphQL
graphql_client = { version = "0.14", features = ["reqwest"] }

# Date and time
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Regex
regex = "1.11"

# Lazy static initialization
once_cell = "1.20"

# Testing
mockall = "0.13"
wiremock = "0.6"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.test]
opt-level = 0
debug = true
